<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TITLE/DESCRIPTION/OG = os MESMOS textos do useSeo() de src/pages/Home.jsx (en).
         Este HTML cru é o que WhatsApp, LinkedIn, Facebook e o primeiro passe do Google leem —
         eles não rodam JavaScript. O título antigo ("Intelligent Solutions for Your Business")
         era o posicionamento de antes: quem compartilhava o link mostrava uma empresa, quem abria
         a página via outra. Mudou o useSeo da Home? Mude aqui no mesmo commit. -->
    <title>Guileo — AI, ads & creative for your business · answers 24/7, and builds your site</title>
    <meta name="description" content="One house: the AI answers calls and messages, books and sells 24/7 in 16 languages — and the team runs your ads, marketing and content, and builds your site, app and custom software. Live in 7 days. From $149/mo, 30-day money-back." />
    <meta name="author" content="Guileo · ORIGEM LTDA" />
    <!-- favicon: browsers that support SVG load the tiny 9kb vector; PNG is the fallback -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- GUILEO APP (PWA). O manifesto vale para a casca da Guileo; ele é REMOVIDO do <head> nas
         rotas /site/:slug (functions/site/[slug].js), onde o app é o do NEGÓCIO do cliente e o
         manifesto tem que ser o dele — nunca dois manifestos, nunca a nossa marca no app dele.
         O service worker é registrado só dentro de /portal (src/pages/Portal.jsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guileo" />
    <meta name="application-name" content="Guileo" />
    <!-- preconnect: shaves the TLS handshake off the critical external requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter. DO NOT reintroduce the media="print" onload="this.media='all'" defer trick here.
         Our CSP has no 'unsafe-inline'/'unsafe-hashes', so the browser BLOCKS that inline
         handler: the sheet stayed at media="print" forever and Inter never loaded in
         production. It failed silently — HTTP 200, no visual error, only a console line —
         so the site shipped in the system-ui fallback for as long as the trick was there
         (found 2026-08-27 by reading the console with gstack /browse).
         A plain stylesheet link always applies. preconnect above already removes the TLS
         handshake from the critical path, and display=swap still renders text immediately
         in the fallback, so there is no invisible-text flash. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    <link rel="preconnect" href="https://unpkg.com" />
    <!-- o preconnect apontava para fccwbafkbhkyrvauzshl.supabase.co, um projeto que o site NÃO usa
         (src/lib/supabase.js fala com ynihodbknhjirkdogxby): abria conexão à toa e deixava a de
         verdade fria. -->
    <link rel="preconnect" href="https://ynihodbknhjirkdogxby.supabase.co" />
    <!-- preconnect: ad pixels (only actually load when their IDs are set in src/lib/analytics.js) -->
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://analytics.tiktok.com" />
    <!-- ───────────────────────────────────────────────────────────────────────
      Content-Security-Policy (mirrors public/_headers, extended for ad pixels).
      This meta tag enforces CSP in dev/preview where _headers does NOT apply.
      Ad-pixel domains added: Meta (connect.facebook.net / www.facebook.com),
      Google gtag/GA4 (www.googletagmanager.com / www.google-analytics.com /
      *.google-analytics.com / *.analytics.google.com), TikTok (analytics.tiktok.com).
      NOTE: public/_headers MUST be updated with the SAME additions (it is the
      authoritative production header).
      cdn.jsdelivr.net/npm/@alexanderolsen/ (2026-09-27): o widget da ElevenLabs carrega o
      reamostrador de áudio (libsamplerate.worklet.js) DESSE endereço quando o navegador não
      entrega o microfone na taxa pedida (Firefox, alguns aparelhos). Worklet é script: sem a
      origem em script-src a chamada de VOZ morre calada nesses navegadores — o texto segue
      funcionando e ninguém percebe. Liberado só o caminho do pacote, não o CDN inteiro.
    ──────────────────────────────────────────────────────────────────────── -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob: https://static.cloudflareinsights.com https://unpkg.com https://cdn.jsdelivr.net/npm/@alexanderolsen/ https://*.elevenlabs.io https://connect.facebook.net https://www.googletagmanager.com https://analytics.tiktok.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net https://p.typekit.net; font-src 'self' data: https://fonts.gstatic.com https://use.typekit.net; img-src 'self' data: blob: https:; connect-src 'self' https://cloudflareinsights.com https://*.supabase.co wss://*.supabase.co https://*.elevenlabs.io wss://*.elevenlabs.io https://*.livekit.cloud wss://*.livekit.cloud https://unpkg.com https://connect.facebook.net https://www.facebook.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.tiktok.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src 'self' https://*.elevenlabs.io; media-src 'self' blob: https://*.elevenlabs.io https://*.supabase.co; worker-src 'self' blob: https://unpkg.com https://*.elevenlabs.io" />

    <!-- JSON-LD em DOIS blocos, os dois marcados com data-guileo-global (src/pages/Novo.jsx remove
